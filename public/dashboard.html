<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e5f8c" />
<title>Tổng quan - Quản lý</title>
<link rel="icon" href="/favicon.png?v=3" type="image/png" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png?v=3" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div id="tabs"></div>

  <div class="container">
    <div class="card">
      <h2>📊 Tổng quan đơn hàng</h2>
      <div id="summary" style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;"></div>
      <div id="weightSummary" style="margin-bottom:14px;"></div>

      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button id="viewModeDay" class="btn secondary" style="margin:0; width:auto; padding:6px 14px; font-size:13px;" onclick="setViewMode('day')">📅 Xem theo ngày</button>
        <button id="viewModeMonth" class="btn secondary" style="margin:0; width:auto; padding:6px 14px; font-size:13px;" onclick="setViewMode('month')">🗓️ Xem theo tháng</button>
        <button class="btn secondary" style="margin:0; width:auto; padding:6px 14px; font-size:13px;" onclick="startWeightBackfill()">🔄 Quét lại kg đơn cũ (từ 1/8)</button>
      </div>
      <div id="backfillStatus" style="display:none; margin-bottom:10px;"></div>

      <div class="day-nav" id="dayNavRow">
        <button onclick="shiftDay(-1)">◀</button>
        <input type="date" id="dayFilter" onchange="onDayChange()" />
        <button onclick="shiftDay(1)">▶</button>
        <button class="today-btn" onclick="goToday()">Hôm nay</button>
        <button class="today-btn" onclick="clearDay()">Xem tất cả ngày</button>
      </div>

      <div class="day-nav" id="monthNavRow" style="display:none;">
        <button onclick="shiftMonth(-1)">◀</button>
        <input type="month" id="monthFilter" onchange="onMonthChange()" />
        <button onclick="shiftMonth(1)">▶</button>
        <button class="today-btn" onclick="goCurrentMonth()">Tháng này</button>
      </div>

      <div class="filters">
        <select id="statusFilter" onchange="loadOrders()">
          <option value="">Tất cả trạng thái</option>
          <option value="cho_soan">Chờ soạn hàng</option>
          <option value="da_soan">Đã giao hàng</option>
          <option value="co_hang_tra">Có hàng trả</option>
        </select>
        <select id="orderTypeFilter" onchange="loadOrders()">
          <option value="">Tất cả loại đơn</option>
          <option value="xuat_kho">Xuất kho</option>
          <option value="nhap_kho">Nhập kho</option>
        </select>
      </div>
      <div class="filters">
        <select id="warehouseFilter" onchange="loadOrders()">
          <option value="">Tất cả các kho</option>
        </select>
        <input type="text" id="customerFilter" placeholder="Tìm theo tên khách..." oninput="debouncedLoad()" />
      </div>

      <div id="orderList">Đang tải...</div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="card">
      <h2 id="modalTitle">Chi tiết đơn hàng</h2>
      <div id="modalContent"></div>
      <button class="btn secondary" onclick="closeModal()">Đóng</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const user = requireLogin(['leader'], 'view_all');
    document.getElementById('topbar').innerHTML = renderTopbar('Tổng quan');
    document.getElementById('tabs').innerHTML = renderNavTabs('dashboard');
    document.getElementById('dayFilter').value = todayStr();
    document.getElementById('monthFilter').value = currentMonthStr();

    let viewMode = 'day'; // 'day' hoac 'month'
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('dayNavRow').style.display = mode === 'day' ? '' : 'none';
      document.getElementById('monthNavRow').style.display = mode === 'month' ? '' : 'none';
      document.getElementById('viewModeDay').style.background = mode === 'day' ? 'var(--primary)' : '';
      document.getElementById('viewModeMonth').style.background = mode === 'month' ? 'var(--primary)' : '';
      loadOrders();
    }
    setViewMode('day');

    let backfillPollTimer = null;
    async function startWeightBackfill() {
      if (!confirm('Quét lại toàn bộ đơn từ 1/8/2026 đến nay chưa có số kg? Có thể mất vài phút tuỳ số lượng đơn.')) return;
      try {
        const data = await apiFetch('/api/orders/backfill-weight', {
          method: 'POST',
          body: JSON.stringify({ from_date: '2026-08-01' }),
        });
        if (data.total === 0) {
          showToast('✅ Không có đơn nào cần quét lại (đã có đủ số kg hoặc không có đơn trong khoảng này).');
          return;
        }
        showToast(`🔄 Đang quét lại ${data.total} đơn, chạy trong nền...`);
        pollBackfillStatus();
      } catch (err) {
        alert(err.message);
      }
    }

    async function pollBackfillStatus() {
      const el = document.getElementById('backfillStatus');
      el.style.display = 'block';
      if (backfillPollTimer) clearInterval(backfillPollTimer);
      backfillPollTimer = setInterval(async () => {
        try {
          const status = await apiFetch('/api/orders/backfill-weight/status');
          if (status.total === 0) {
            el.style.display = 'none';
            clearInterval(backfillPollTimer);
            return;
          }
          const pct = Math.round((status.processed / status.total) * 100);
          el.innerHTML = `<p class="hint">🔄 Đang quét: ${status.processed}/${status.total} đơn (${pct}%) - đã tìm được ${status.updated} số kg.</p>`;
          if (!status.running) {
            clearInterval(backfillPollTimer);
            el.innerHTML = `<p class="hint">✅ Đã quét xong ${status.total} đơn, tìm được số kg cho ${status.updated} đơn.</p>`;
            showToast(`✅ Quét xong! Tìm được số kg cho ${status.updated}/${status.total} đơn.`);
            loadOrders();
            setTimeout(() => { el.style.display = 'none'; }, 6000);
          }
        } catch (err) {
          clearInterval(backfillPollTimer);
        }
      }, 2000);
    }

    // Neu co job dang chay san (vi du admin reload lai trang giua chung) - tiep tuc theo doi luon
    apiFetch('/api/orders/backfill-weight/status')
      .then((status) => { if (status.running) pollBackfillStatus(); })
      .catch(() => {});

    function shiftMonth(delta) {
      const el = document.getElementById('monthFilter');
      el.value = addMonthsStr(el.value || currentMonthStr(), delta);
      loadOrders();
    }
    function goCurrentMonth() {
      document.getElementById('monthFilter').value = currentMonthStr();
      loadOrders();
    }
    function onMonthChange() {
      loadOrders();
    }

    function shiftDay(delta) {
      const el = document.getElementById('dayFilter');
      el.value = addDaysStr(el.value || todayStr(), delta);
      loadOrders();
    }
    function goToday() {
      document.getElementById('dayFilter').value = todayStr();
      loadOrders();
    }
    function clearDay() {
      document.getElementById('dayFilter').value = '';
      loadOrders();
    }
    function onDayChange() {
      loadOrders();
    }

    let debounceTimer = null;
    function debouncedLoad() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadOrders, 400);
    }

    async function loadWarehouseFilter() {
      try {
        const data = await apiFetch('/api/warehouses');
        const select = document.getElementById('warehouseFilter');
        select.innerHTML =
          '<option value="">Tất cả các kho</option>' +
          data.warehouses.map((w) => `<option value="${w.id}">${w.name}</option>`).join('');
      } catch (err) {}
    }

    async function loadOrders() {
      const status = document.getElementById('statusFilter').value;
      const orderType = document.getElementById('orderTypeFilter').value;
      const customer = document.getElementById('customerFilter').value.trim();
      const date = document.getElementById('dayFilter').value;
      const month = document.getElementById('monthFilter').value;
      const warehouseId = document.getElementById('warehouseFilter').value;
      const el = document.getElementById('orderList');
      el.innerHTML = 'Đang tải...';

      const params = new URLSearchParams();
      if (status) params.set('status', status);
      if (orderType) params.set('order_type', orderType);
      if (customer) params.set('customer', customer);
      if (viewMode === 'month') {
        if (month) params.set('month', month);
      } else if (date) {
        params.set('date', date);
      }
      if (warehouseId) params.set('warehouse_id', warehouseId);

      try {
        const data = await apiFetch(`/api/orders?${params.toString()}`);
        renderSummary(data.orders);
        if (data.orders.length === 0) {
          el.innerHTML = '<p class="hint">Không có đơn hàng nào phù hợp.</p>';
          return;
        }
        const cappedNote =
          data.orders.length >= 3000
            ? '<p class="hint" style="color:var(--warning);">⚠️ Danh sách/thống kê đang bị giới hạn ở 3000 đơn gần nhất trong khoảng đang xem - nếu thấy thiếu, thử thu hẹp bộ lọc lại.</p>'
            : '';
        el.innerHTML = cappedNote + data.orders
          .map(
            (o) => `
          <div class="order-item">
            <img src="/uploads/${o.order_photo_path}" onclick="event.stopPropagation(); openImageViewer('/uploads/${o.order_photo_path}')" loading="lazy" />
            <div class="info" onclick="openOrder(${o.id})">
              <div class="name">${orderDisplayName(o)}</div>
              <div class="meta">
                <span class="badge ${o.order_type}">${orderTypeLabel(o.order_type)}</span>
                <span class="badge ${o.status}">${statusLabel(o.status, o.order_type)}</span>
              </div>
              ${renderWarehouseChips(o.warehouses, o.order_type)}
              ${o.total_weight_kg !== null && o.total_weight_kg !== undefined ? `<div class="weight-chip">⚖️ ${o.total_weight_kg} kg</div>` : ''}
              <div class="meta" style="margin-top:6px;">
                Sales: ${o.sales_username} &nbsp;·&nbsp; ${formatDateTime(o.created_at)}
              </div>
              ${o.note ? `<div class="note-inline">📝 ${o.note}</div>` : ''}
            </div>
          </div>`
          )
          .join('');
      } catch (err) {
        el.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function renderSummary(orders) {
      const counts = { cho_soan: 0, da_soan: 0, co_hang_tra: 0 };
      orders.forEach((o) => { if (counts[o.status] !== undefined) counts[o.status]++; });
      document.getElementById('summary').innerHTML = `
        <div class="badge cho_soan" style="font-size:14px; padding:8px 14px;">Chờ soạn: ${counts.cho_soan}</div>
        <div class="badge da_soan" style="font-size:14px; padding:8px 14px;">Đã giao: ${counts.da_soan}</div>
        <div class="badge co_hang_tra" style="font-size:14px; padding:8px 14px;">Hàng trả: ${counts.co_hang_tra}</div>
      `;

      // Tong so kg - tach rieng thanh 1 khung to, ro rang, khong lan voi cac badge trang thai nho
      // ben tren, de "nhin vao la thay ngay" nhu yeu cau.
      const totalWeight = orders.reduce((sum, o) => sum + (typeof o.total_weight_kg === 'number' ? o.total_weight_kg : 0), 0);
      const ordersWithWeight = orders.filter((o) => typeof o.total_weight_kg === 'number').length;
      document.getElementById('weightSummary').innerHTML =
        ordersWithWeight > 0
          ? `<div style="display:flex; align-items:center; gap:12px; background:#fef3c7; border:1px solid #f5c451; border-radius:10px; padding:14px 18px;">
               <span style="font-size:28px;">⚖️</span>
               <div>
                 <div style="font-size:22px; font-weight:800; color:#92400e; line-height:1.2;">${totalWeight.toFixed(2)} kg</div>
                 <div style="font-size:12px; color:#92400e; opacity:0.85;">Tổng số kg (${ordersWithWeight}/${orders.length} đơn có ghi kg)</div>
               </div>
             </div>`
          : `<p class="hint">⚖️ Chưa có đơn nào trong danh sách này ghi được số kg.</p>`;
    }

    async function openOrder(id) {
      const data = await apiFetch(`/api/orders/${id}`);
      currentOrderId = id;
      document.getElementById('modalTitle').textContent = orderDisplayName(data.order);

      const photosHtml = data.photos
        .map(
          (p) => `
        <div>
          <img src="/uploads/${p.photo_path}" onclick="openImageViewer('/uploads/${p.photo_path}')" loading="lazy" />
          <div class="label">${{ order: 'Đơn gốc', packed: 'Đã giao hàng', return: 'Hàng trả' }[p.type]}${p.warehouse_name ? ' - ' + p.warehouse_name : ''}</div>
        </div>`
        )
        .join('');

      const warehousesBreakdown = renderWarehouseChips(data.order.warehouses, data.order.order_type);

      const canManage = hasUserRole(user, 'leader') || hasUserPermission(user, 'delete_any_order');
      document.getElementById('modalContent').innerHTML = `
        <p class="hint">
          Loại đơn: <span class="badge ${data.order.order_type}">${orderTypeLabel(data.order.order_type)}</span><br/>
          Trạng thái chung: <span class="badge ${data.order.status}">${statusLabel(data.order.status, data.order.order_type)}</span><br/>
          Sales tạo đơn: ${data.order.sales_username}<br/>
          Tạo lúc: ${formatDateTime(data.order.created_at)}
        </p>
        ${data.order.note ? `<div class="note-box">📝 <b>Ghi chú:</b> ${data.order.note}</div>` : ''}
        ${warehousesBreakdown}
        <div class="photo-gallery">${photosHtml}</div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          ${canManage ? '<button class="btn secondary" style="margin:0; flex:1;" onclick="startEditOrder(' + data.order.id + ')">✏️ Sửa đơn</button>' : ''}
          ${canManage ? '<button class="btn danger" style="margin:0; flex:1;" onclick="deleteCurrentOrder()">🗑️ Xoá đơn</button>' : ''}
        </div>
        <div id="deleteMsg"></div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    async function deleteCurrentOrder() {
      if (!currentOrderId) return;
      const confirmed = confirm('Xoá đơn hàng này? Toàn bộ hình ảnh liên quan sẽ bị xoá vĩnh viễn, không thể khôi phục.');
      if (!confirmed) return;
      try {
        await apiFetch(`/api/orders/${currentOrderId}`, { method: 'DELETE' });
        closeModal();
        loadOrders();
      } catch (err) {
        document.getElementById('deleteMsg').innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      currentOrderId = null;
    }

    let currentOrderId = null;
    window.refreshList = loadOrders;
    loadWarehouseFilter();
    loadOrders();
  </script>
</body>
</html>
