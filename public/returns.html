<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e5f8c" />
<title>Hàng trả</title>
<link rel="icon" href="/favicon.png?v=3" type="image/png" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png?v=3" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div id="tabs"></div>

  <div class="container">
    <div class="card">
      <h2>↩️ Lập phiếu trả hàng mới</h2>
      <p id="roleHint" class="hint"></p>

      <label>Kho</label>
      <select id="warehouseSelect">
        <option value="">-- Chọn kho --</option>
      </select>

      <label>Mã đơn hàng (tuỳ chọn - chọn đúng mã sẽ tự điền tên khách)</label>
      <input type="text" id="orderCodeInput" placeholder="Ví dụ: BH83746" list="orderCodeList" oninput="onOrderCodeInput()" />
      <datalist id="orderCodeList"></datalist>

      <label>Tên khách hàng</label>
      <input type="text" id="customerName" placeholder="Nhập tên khách hàng..." list="customerList" />
      <datalist id="customerList"></datalist>

      <label>Ghi chú (tuỳ chọn)</label>
      <textarea id="note" placeholder="Ví dụ: lý do trả hàng, số lượng, tình trạng hàng..."></textarea>

      <div id="photoTypeToggle" style="display:none; margin-bottom:10px;">
        <label style="display:inline-flex; align-items:center; gap:6px; margin-right:16px; font-weight:400; margin-bottom:4px;">
          <input type="radio" name="photoType" value="voucher" checked onchange="onPhotoTypeChange()" /> 📄 Tôi có ảnh phiếu trả hàng (vai trò Sales)
        </label>
        <label style="display:inline-flex; align-items:center; gap:6px; font-weight:400;">
          <input type="radio" name="photoType" value="goods" onchange="onPhotoTypeChange()" /> 📦 Tôi có ảnh hàng thực trả (vai trò Thủ kho)
        </label>
      </div>

      <div id="photoSection">
        <label id="photoLabel"></label>
        <div style="display:flex; gap:8px; margin-top:6px; margin-bottom:6px;">
          <button type="button" class="btn secondary" style="margin:0; flex:1;" onclick="document.getElementById('photoInputCamera').click()">📷 Chụp ảnh</button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photoInputCamera" style="display:none" onchange="onPhotoSelected(event)" />
        <div class="file-drop" onclick="document.getElementById('photoInput').click()">
          <div id="dropText">🖼️ Nhấn để chọn ảnh có sẵn (hoặc dán ảnh bằng Ctrl+V)</div>
          <img id="preview" style="display:none;" />
        </div>
        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onPhotoSelected(event)" />
      </div>

      <button class="btn" onclick="submitReturn()">Lập phiếu trả hàng</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>📋 Danh sách phiếu trả hàng</h2>
      <div class="filters">
        <select id="statusFilter" onchange="loadReturns()">
          <option value="">Tất cả trạng thái</option>
          <option value="cho_kho_xac_nhan">Chờ kho gửi ảnh hàng thực trả</option>
          <option value="cho_sales_xac_nhan">Chờ sales gửi ảnh phiếu trả hàng</option>
          <option value="hoan_tat">Hoàn tất</option>
        </select>
        <select id="warehouseFilter" onchange="loadReturns()" style="display:none;"></select>
      </div>
      <div id="returnList">Đang tải...</div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="card">
      <h2 id="modalTitle">Chi tiết phiếu trả hàng</h2>
      <div id="modalContent"></div>
      <button class="btn secondary" onclick="closeModal()">Đóng</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const user = requireLogin(['sales', 'warehouse', 'leader']);
    document.getElementById('topbar').innerHTML = renderTopbar('Hàng trả');
    document.getElementById('tabs').innerHTML = renderNavTabs('returns');

    let selectedFile = null;
    let currentReturn = null;

    // Thiet ke: Sales (vai tro CHINH) luon dinh kem anh PHIEU tra hang; Thu kho luon dinh kem anh
    // HANG THUC TRA - khong phu thuoc ai lap phieu truoc, ca 2 phia deu BAT BUOC co dung 1 loai anh
    // cua minh. Tai khoan chi giu 1 trong 2 vai tro se duoc co dinh loai anh tuong ung; tai khoan
    // kiem ca 2 (hoac Quan ly khong giu vai tro nao) duoc chon loai anh qua nut radio.
    const hasSalesRole = hasUserRole(user, 'sales');
    const hasWarehouseRole = hasUserRole(user, 'warehouse');
    let currentPhotoType = hasSalesRole ? 'voucher' : hasWarehouseRole ? 'goods' : 'voucher';
    const showPhotoTypeToggle = !((hasSalesRole && !hasWarehouseRole) || (hasWarehouseRole && !hasSalesRole));
    if (showPhotoTypeToggle) {
      document.getElementById('photoTypeToggle').style.display = '';
      document.querySelector(`input[name="photoType"][value="${currentPhotoType}"]`).checked = true;
    }

    function updatePhotoLabel() {
      document.getElementById('photoLabel').textContent =
        currentPhotoType === 'voucher' ? '📄 Ảnh phiếu trả hàng (bắt buộc)' : '📦 Ảnh hàng thực trả (bắt buộc)';
    }
    function onPhotoTypeChange() {
      currentPhotoType = document.querySelector('input[name="photoType"]:checked').value;
      updatePhotoLabel();
    }
    updatePhotoLabel();

    document.getElementById('roleHint').textContent =
      currentPhotoType === 'voucher' && !showPhotoTypeToggle
        ? 'Đính kèm ảnh phiếu trả hàng. Thủ kho sẽ gửi ảnh hàng thực trả để hoàn tất khi nhận được hàng.'
        : !showPhotoTypeToggle
        ? 'Nếu khách trả hàng trực tiếp tại kho: đính kèm ảnh hàng thực trả ngay bên dưới. Sales sẽ gửi ảnh phiếu trả hàng để hoàn tất.'
        : 'Chọn đúng loại ảnh bạn đang có ở trên (phiếu trả hàng hoặc hàng thực trả), rồi đính kèm bên dưới.';

    function onPhotoSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      const preview = document.getElementById('preview');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      document.getElementById('dropText').textContent = 'Nhấn để chọn hình khác';
    }

    // Cho phep dan anh bang Ctrl+V (copy tu Zalo, Excel, anh chup man hinh...) - anh gio la bat
    // buoc voi ca 2 phia (Sales & Thu kho) nen luon bat, khong con dieu kien theo vai tro nua.
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            onPhotoSelected({ target: { files: [file] } });
          }
          break;
        }
      }
    });

    async function loadWarehouses() {
      const data = await apiFetch('/api/warehouses');
      const opts = data.warehouses.map((w) => `<option value="${w.id}">${w.name}</option>`).join('');
      document.getElementById('warehouseSelect').innerHTML = '<option value="">-- Chọn kho --</option>' + opts;
      if (hasUserRole(user, 'leader')) {
        const filterEl = document.getElementById('warehouseFilter');
        filterEl.style.display = '';
        filterEl.innerHTML = '<option value="">Tất cả các kho</option>' + opts;
      }
    }

    async function loadCustomerSuggestions() {
      try {
        const data = await apiFetch('/api/customers');
        document.getElementById('customerList').innerHTML = data.customers
          .map((c) => `<option value="${c.name}"></option>`)
          .join('');
      } catch (err) {}
    }

    // Goi y ma don hang khi go, va tu dien ten khach khi go/chon DUNG 1 ma da co - de sales/thu kho
    // khong phai nho lai hoac go tay ten khach, giam sai sot chinh ta ten.
    let orderCodeLookupCache = {};
    let orderCodeLookupTimer = null;

    function tryAutoFillFromOrderCode() {
      const val = document.getElementById('orderCodeInput').value.trim();
      const key = Object.keys(orderCodeLookupCache).find((k) => k.toLowerCase() === val.toLowerCase());
      if (key) document.getElementById('customerName').value = orderCodeLookupCache[key];
    }

    function onOrderCodeInput() {
      tryAutoFillFromOrderCode();
      if (orderCodeLookupTimer) clearTimeout(orderCodeLookupTimer);
      const val = document.getElementById('orderCodeInput').value.trim();
      if (val.length < 2) {
        document.getElementById('orderCodeList').innerHTML = '';
        return;
      }
      orderCodeLookupTimer = setTimeout(async () => {
        try {
          const data = await apiFetch(`/api/orders/lookup-by-code?code=${encodeURIComponent(val)}`);
          orderCodeLookupCache = {};
          document.getElementById('orderCodeList').innerHTML = data.orders
            .map((o) => {
              orderCodeLookupCache[o.order_code] = o.customer_name;
              return `<option value="${o.order_code}">${o.customer_name}</option>`;
            })
            .join('');
          tryAutoFillFromOrderCode();
        } catch (err) {
          // Mat mang tam thoi - bo qua, sales van tu nhap ten khach binh thuong duoc
        }
      }, 300);
    }

    async function submitReturn() {
      const warehouseId = document.getElementById('warehouseSelect').value;
      const orderCode = document.getElementById('orderCodeInput').value.trim();
      const customerName = document.getElementById('customerName').value.trim();
      const note = document.getElementById('note').value.trim();
      const msg = document.getElementById('msg');
      msg.className = '';
      msg.textContent = '';

      if (!warehouseId) { msg.className = 'error-msg'; msg.textContent = 'Vui lòng chọn kho.'; return; }
      if (!customerName) { msg.className = 'error-msg'; msg.textContent = 'Vui lòng nhập tên khách hàng.'; return; }
      if (!selectedFile) {
        msg.className = 'error-msg';
        msg.textContent = currentPhotoType === 'voucher' ? 'Vui lòng đính kèm ảnh phiếu trả hàng.' : 'Vui lòng đính kèm ảnh hàng thực trả.';
        return;
      }

      const form = new FormData();
      form.append('warehouse_id', warehouseId);
      if (orderCode) form.append('order_code', orderCode);
      form.append('customer_name', customerName);
      if (note) form.append('note', note);
      form.append('photo_type', currentPhotoType);
      form.append('photo', selectedFile);

      try {
        await apiFetch('/api/returns', { method: 'POST', body: form });
        msg.className = 'success-msg';
        msg.textContent = '✅ Đã lập phiếu trả hàng thành công!';
        document.getElementById('orderCodeInput').value = '';
        document.getElementById('orderCodeList').innerHTML = '';
        orderCodeLookupCache = {};
        document.getElementById('customerName').value = '';
        document.getElementById('note').value = '';
        selectedFile = null;
        document.getElementById('photoInput').value = '';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('dropText').textContent = '🖼️ Nhấn để chọn ảnh có sẵn (hoặc dán ảnh bằng Ctrl+V)';
        loadReturns();
        loadCustomerSuggestions();
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
      }
    }

    async function loadReturns() {
      const status = document.getElementById('statusFilter').value;
      const warehouseId = document.getElementById('warehouseFilter').value;
      const el = document.getElementById('returnList');
      el.innerHTML = 'Đang tải...';
      try {
        const params = new URLSearchParams();
        if (status) params.set('status', status);
        if (warehouseId) params.set('warehouse_id', warehouseId);
        const data = await apiFetch(`/api/returns?${params.toString()}`);
        if (data.returns.length === 0) {
          el.innerHTML = '<p class="hint">Không có phiếu trả hàng nào.</p>';
          return;
        }
        el.innerHTML = data.returns
          .map(
            (r) => `
          <div class="order-item" onclick="openReturn(${r.id})">
            ${(r.voucher_photo_path || r.goods_photo_path) ? `<img src="/uploads/${r.voucher_photo_path || r.goods_photo_path}" onclick="event.stopPropagation(); openImageViewer('/uploads/${r.voucher_photo_path || r.goods_photo_path}')" loading="lazy" />` : '<div style="width:64px;height:64px;background:#f1f1f1;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;">Chưa có hình</div>'}
            <div class="info">
              <div class="name">${r.customer_name}${r.order_code ? ` <span style="color:var(--muted); font-weight:400; font-size:12px;">(${r.order_code})</span>` : ''}</div>
              <div class="meta">
                <span class="badge ${r.status}">${statusLabel(r.status)}</span>
                &nbsp;·&nbsp; ${r.warehouse_name || ''} &nbsp;·&nbsp; Lập bởi: ${r.initiated_by_username} &nbsp;·&nbsp; ${formatDateTime(r.created_at)}
              </div>
            </div>
          </div>`
          )
          .join('');
      } catch (err) {
        el.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    async function openReturn(id) {
      const data = await apiFetch(`/api/returns/${id}`);
      currentReturn = data.return;
      document.getElementById('modalTitle').textContent = currentReturn.customer_name;

      let actionHtml = '';
      if (currentReturn.status === 'cho_kho_xac_nhan' && (hasUserRole(user, 'warehouse') || hasUserRole(user, 'leader'))) {
        actionHtml = `
          <label>📦 Gửi ảnh hàng thực trả để hoàn tất</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="btn secondary" style="margin:0; flex:1;" onclick="document.getElementById('confirmPhotoCamera').click()">📷 Chụp ảnh</button>
            <button type="button" class="btn secondary" style="margin:0; flex:1;" onclick="document.getElementById('confirmPhotoGallery').click()">🖼️ Chọn ảnh có sẵn</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="confirmPhotoCamera" style="display:none" onchange="confirmWithGoodsPhoto(this)" />
          <input type="file" accept="image/*" id="confirmPhotoGallery" style="display:none" onchange="confirmWithGoodsPhoto(this)" />
        `;
      } else if (currentReturn.status === 'cho_sales_xac_nhan' && (hasUserRole(user, 'sales') || hasUserRole(user, 'leader'))) {
        actionHtml = `
          <label>📄 Gửi ảnh phiếu trả hàng để hoàn tất</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="btn secondary" style="margin:0; flex:1;" onclick="document.getElementById('confirmVoucherCamera').click()">📷 Chụp ảnh</button>
            <button type="button" class="btn secondary" style="margin:0; flex:1;" onclick="document.getElementById('confirmVoucherGallery').click()">🖼️ Chọn ảnh có sẵn</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="confirmVoucherCamera" style="display:none" onchange="confirmWithVoucherPhoto(this)" />
          <input type="file" accept="image/*" id="confirmVoucherGallery" style="display:none" onchange="confirmWithVoucherPhoto(this)" />
        `;
      }

      const canDelete =
        hasUserRole(user, 'leader') ||
        hasUserPermission(user, 'delete_any_order') ||
        (currentReturn.initiated_by_username === user.username && currentReturn.status !== 'hoan_tat');
      const canManageAdmin = hasUserRole(user, 'leader');

      const photoSlotHtml = (label, path) => `
        <div style="flex:1; min-width:140px;">
          <div class="hint" style="margin-bottom:4px; font-weight:600;">${label}</div>
          ${path
            ? `<img src="/uploads/${path}" style="max-width:100%;border-radius:8px;cursor:pointer;" onclick="openImageViewer('/uploads/${path}')" />`
            : '<p class="hint">Chưa có.</p>'}
        </div>`;

      document.getElementById('modalContent').innerHTML = `
        <p class="hint">
          Trạng thái: <span class="badge ${currentReturn.status}">${statusLabel(currentReturn.status)}</span><br/>
          Kho: ${currentReturn.warehouse_name || ''}<br/>
          ${currentReturn.order_code ? `Mã đơn hàng: <b>${currentReturn.order_code}</b><br/>` : ''}
          Lập bởi: ${currentReturn.initiated_by_username} (${roleLabel(currentReturn.initiated_by_role)}) · ${formatDateTime(currentReturn.created_at)}<br/>
          ${currentReturn.confirmed_by_username ? 'Xác nhận bởi: ' + currentReturn.confirmed_by_username : ''}
        </p>
        ${currentReturn.note ? `<div class="note-box">📝 <b>Ghi chú:</b> ${currentReturn.note}</div>` : ''}
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;">
          ${photoSlotHtml('📄 Phiếu trả hàng (Sales)', currentReturn.voucher_photo_path)}
          ${photoSlotHtml('📦 Hàng thực trả (Thủ kho)', currentReturn.goods_photo_path)}
        </div>
        ${actionHtml}
        <div style="display:flex; gap:10px; margin-top:14px;">
          ${canManageAdmin ? '<button class="btn secondary" style="margin:0; flex:1;" onclick="startEditReturn()">✏️ Sửa phiếu (Admin)</button>' : ''}
          ${canDelete ? '<button class="btn danger" style="margin:0; flex:1;" onclick="deleteReturn()">🗑️ Xoá phiếu</button>' : ''}
        </div>
        <div id="actionMsg"></div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    async function deleteReturn() {
      if (!currentReturn) return;
      if (!confirm(`Xoá phiếu trả hàng của "${currentReturn.customer_name}"? Hành động này không thể hoàn tác.`)) return;
      const msg = document.getElementById('actionMsg');
      try {
        await apiFetch(`/api/returns/${currentReturn.id}`, { method: 'DELETE' });
        showToast('🗑️ Đã xoá phiếu trả hàng.');
        closeModal();
        loadReturns();
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
      }
    }

    // Sua phieu - CHI ADMIN/QUAN LY. Dung khi lo dang nham anh o sai vai tro (Sales/Thu kho) hoac
    // can sua nhanh thong tin (kho, ma don, ten khach, ghi chu).
    async function startEditReturn() {
      if (!currentReturn) return;
      const whData = await apiFetch('/api/warehouses');
      const whOptions = whData.warehouses
        .map((w) => `<option value="${w.id}" ${w.id === currentReturn.warehouse_id ? 'selected' : ''}>${w.name}</option>`)
        .join('');
      const hasAnyPhoto = currentReturn.voucher_photo_path || currentReturn.goods_photo_path;

      document.getElementById('modalContent').innerHTML = `
        <label>Kho</label>
        <select id="editReturnWarehouse">${whOptions}</select>
        <label>Mã đơn hàng</label>
        <input type="text" id="editReturnOrderCode" value="${(currentReturn.order_code || '').replace(/"/g, '&quot;')}" />
        <label>Tên khách hàng</label>
        <input type="text" id="editReturnCustomerName" value="${(currentReturn.customer_name || '').replace(/"/g, '&quot;')}" />
        <label>Ghi chú</label>
        <textarea id="editReturnNote">${currentReturn.note || ''}</textarea>
        ${hasAnyPhoto ? `
          <p class="hint" style="margin-top:10px;">Nếu ảnh bị lỡ đăng nhầm ô (ví dụ thủ kho chụp hàng thực trả nhưng lại lưu vào ô "Phiếu trả hàng"), bấm nút dưới để đổi ngược lại 2 ô ảnh cho đúng.</p>
          <button type="button" class="btn secondary" style="margin:0;" onclick="swapReturnPhotoSlots()">🔄 Đổi ngược vai trò 2 ảnh</button>
        ` : ''}
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn" style="margin:0; flex:1;" onclick="submitEditReturn()">💾 Lưu thay đổi</button>
          <button class="btn secondary" style="margin:0; flex:1;" onclick="openReturn(${currentReturn.id})">Hủy</button>
        </div>
        <div id="actionMsg"></div>
      `;
    }

    async function submitEditReturn() {
      const msg = document.getElementById('actionMsg');
      const customerName = document.getElementById('editReturnCustomerName').value.trim();
      if (!customerName) {
        msg.className = 'error-msg';
        msg.textContent = 'Vui lòng nhập tên khách hàng.';
        return;
      }
      try {
        await apiFetch(`/api/returns/${currentReturn.id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            warehouse_id: document.getElementById('editReturnWarehouse').value,
            order_code: document.getElementById('editReturnOrderCode').value.trim(),
            customer_name: customerName,
            note: document.getElementById('editReturnNote').value.trim(),
          }),
        });
        showToast('✅ Đã lưu thay đổi phiếu trả hàng.');
        loadReturns();
        openReturn(currentReturn.id);
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
      }
    }

    async function swapReturnPhotoSlots() {
      if (!currentReturn) return;
      if (!confirm('Đổi ngược ảnh "Phiếu trả hàng" và "Hàng thực trả" cho phiếu này?')) return;
      const msg = document.getElementById('actionMsg');
      try {
        await apiFetch(`/api/returns/${currentReturn.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ swap_photo_slots: true }),
        });
        showToast('✅ Đã đổi ngược vai trò 2 ảnh.');
        loadReturns();
        openReturn(currentReturn.id);
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
      }
    }

    async function confirmWithGoodsPhoto(inputEl) {
      const file = inputEl.files[0];
      if (!file || !currentReturn) return;
      const msg = document.getElementById('actionMsg');
      msg.className = 'hint';
      msg.innerHTML = '<span class="spinner" style="border-top-color:var(--primary); border-color:rgba(30,95,140,0.3);"></span>Đang tải hình lên...';
      const form = new FormData();
      form.append('photo', file);
      try {
        await apiFetch(`/api/returns/${currentReturn.id}/goods-photo`, { method: 'POST', body: form });
        msg.className = 'success-msg';
        msg.textContent = '✅ Đã gửi ảnh hàng thực trả, phiếu hoàn tất!';
        loadReturns();
        setTimeout(() => openReturn(currentReturn.id), 600);
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
        inputEl.value = ''; // cho phep chon/chup lai ngay, kho phai doi reset thu cong
      }
    }

    async function confirmWithVoucherPhoto(inputEl) {
      const file = inputEl.files[0];
      if (!file || !currentReturn) return;
      const msg = document.getElementById('actionMsg');
      msg.className = 'hint';
      msg.innerHTML = '<span class="spinner" style="border-top-color:var(--primary); border-color:rgba(30,95,140,0.3);"></span>Đang tải hình lên...';
      const form = new FormData();
      form.append('photo', file);
      try {
        await apiFetch(`/api/returns/${currentReturn.id}/voucher-photo`, { method: 'POST', body: form });
        msg.className = 'success-msg';
        msg.textContent = '✅ Đã gửi ảnh phiếu trả hàng, phiếu hoàn tất!';
        loadReturns();
        setTimeout(() => openReturn(currentReturn.id), 600);
      } catch (err) {
        msg.className = 'error-msg';
        msg.textContent = err.message;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      currentReturn = null;
    }

    loadWarehouses();
    window.refreshList = loadReturns;
    loadCustomerSuggestions();
    loadReturns();
  </script>
</body>
</html>
