<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e5f8c" />
<title>Đơn hàng của tôi</title>
<link rel="icon" href="/favicon.png?v=3" type="image/png" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png?v=3" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div id="tabs"></div>

  <div class="container">
    <div class="card">
      <h2 style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span>📑 Đơn hàng</span>
        <button class="btn secondary" style="margin:0; width:auto; padding:6px 12px; font-size:13px;" onclick="loadOrders()">🔄 Làm mới</button>
      </h2>
      <p class="hint">Xem đơn của tất cả sales, có ghi rõ ai đã đăng đơn nào.</p>

      <label style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <input type="checkbox" id="onlyMineFilter" onchange="loadOrders()" style="width:18px; height:18px; margin:0;" />
        <span style="font-size:14px; color:var(--text);">Chỉ hiện đơn của tôi</span>
      </label>

      <div class="day-nav">
        <button onclick="shiftDay(-1)">◀</button>
        <input type="date" id="dayFilter" onchange="loadOrders()" />
        <button onclick="shiftDay(1)">▶</button>
        <button class="today-btn" onclick="goToday()">Hôm nay</button>
        <button class="today-btn" onclick="clearDay()">Tất cả ngày</button>
      </div>

      <div class="filters">
        <select id="statusFilter" onchange="loadOrders()">
          <option value="">Tất cả trạng thái</option>
          <option value="cho_soan">Chờ soạn hàng</option>
          <option value="da_soan">Đã giao hàng</option>
          <option value="co_hang_tra">Có hàng trả</option>
        </select>
        <select id="orderTypeFilter" onchange="loadOrders()">
          <option value="">Tất cả loại đơn</option>
          <option value="xuat_kho">Xuất kho</option>
          <option value="nhap_kho">Nhập kho</option>
        </select>
      </div>
      <div class="filters">
        <input type="text" id="customerFilter" placeholder="Tìm theo tên khách..." oninput="debouncedLoad()" />
      </div>

      <div id="orderList">Đang tải...</div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="card">
      <h2 id="modalTitle">Chi tiết đơn hàng</h2>
      <div id="modalContent"></div>
      <button class="btn secondary" onclick="closeModal()">Đóng</button>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const user = requireLogin(['sales', 'leader']);
    document.getElementById('topbar').innerHTML = renderTopbar('Đơn hàng của tôi');
    document.getElementById('tabs').innerHTML = renderNavTabs('myorders');

    let debounceTimer = null;
    function debouncedLoad() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadOrders, 400);
    }

    function shiftDay(delta) {
      const el = document.getElementById('dayFilter');
      el.value = addDaysStr(el.value || todayStr(), delta);
      loadOrders();
    }
    function goToday() {
      document.getElementById('dayFilter').value = todayStr();
      loadOrders();
    }
    function clearDay() {
      document.getElementById('dayFilter').value = '';
      loadOrders();
    }
    document.getElementById('dayFilter').value = todayStr();

    async function loadOrders() {
      const status = document.getElementById('statusFilter').value;
      const orderType = document.getElementById('orderTypeFilter').value;
      const customer = document.getElementById('customerFilter').value.trim();
      const date = document.getElementById('dayFilter').value;
      const el = document.getElementById('orderList');
      el.innerHTML = 'Đang tải...';

      const params = new URLSearchParams();
      params.set('view', 'sales');
      if (document.getElementById('onlyMineFilter').checked) params.set('mine', '1');
      if (status) params.set('status', status);
      if (orderType) params.set('order_type', orderType);
      if (customer) params.set('customer', customer);
      if (date) params.set('date', date);

      try {
        const data = await apiFetch(`/api/orders?${params.toString()}`);
        if (data.orders.length === 0) {
          el.innerHTML = '<p class="hint">Không có đơn hàng nào phù hợp.</p>';
          return;
        }
        el.innerHTML = data.orders
          .map(
            (o) => `
          <div class="order-item">
            <img src="/uploads/${o.order_photo_path}" onclick="event.stopPropagation(); openImageViewer('/uploads/${o.order_photo_path}')" loading="lazy" />
            <div class="info" onclick="openOrderDetail(${o.id})">
              <div class="name">${orderDisplayName(o)}</div>
              <div class="meta">
                <span class="badge ${o.order_type}">${orderTypeLabel(o.order_type)}</span>
                <span class="badge ${o.status}">${statusLabel(o.status, o.order_type)}</span>
              </div>
              ${renderWarehouseChips(o.warehouses, o.order_type)}
              <div class="meta" style="margin-top:6px;">
                Sales: <b>${o.sales_username}</b> &nbsp;·&nbsp; ${formatDateTime(o.created_at)}
              </div>
              ${o.note ? `<div class="note-inline">📝 ${o.note}</div>` : ''}
            </div>
          </div>`
          )
          .join('');
      } catch (err) {
        el.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    let currentDetailOrder = null;

    async function openOrderDetail(id) {
      const data = await apiFetch(`/api/orders/${id}`);
      currentDetailOrder = data.order;
      document.getElementById('modalTitle').textContent = orderDisplayName(data.order);

      const warehousesBreakdown = renderWarehouseChips(data.order.warehouses, data.order.order_type);

      const photosHtml = data.photos
        .map(
          (p) => `
        <div>
          <img src="/uploads/${p.photo_path}" onclick="openImageViewer('/uploads/${p.photo_path}')" loading="lazy" />
          <div class="label">${{ order: 'Đơn gốc', packed: 'Đã giao hàng', return: 'Hàng trả' }[p.type]}${p.warehouse_name ? ' - ' + p.warehouse_name : ''}${p.type !== 'order' ? ' · ' + formatDateTime(p.uploaded_at) : ''}</div>
        </div>`
        )
        .join('');

      const canDelete =
        (hasUserRole(user, 'sales') && data.order.sales_username === user.username && data.order.status === 'cho_soan') ||
        hasUserPermission(user, 'delete_any_order');
      const canEdit = canEditOrder(user, data.order);

      document.getElementById('modalContent').innerHTML = `
        <p class="hint">
          Loại đơn: <span class="badge ${data.order.order_type}">${orderTypeLabel(data.order.order_type)}</span><br/>
          Trạng thái chung: <span class="badge ${data.order.status}">${statusLabel(data.order.status, data.order.order_type)}</span><br/>
          Sales đăng đơn: <b>${data.order.sales_username}</b><br/>
          Tạo lúc: ${formatDateTime(data.order.created_at)}
        </p>
        ${data.order.note ? `<div class="note-box">📝 <b>Ghi chú:</b> ${data.order.note}</div>` : ''}
        ${warehousesBreakdown}
        <div class="photo-gallery">${photosHtml}</div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          ${canEdit ? '<button class="btn secondary" style="margin:0; flex:1;" onclick="startEditOrder(' + data.order.id + ')">✏️ Sửa đơn</button>' : ''}
          ${canDelete ? '<button class="btn danger" style="margin:0; flex:1;" onclick="deleteMyOrder()">🗑️ Xoá đơn (lỡ đăng sai)</button>' : ''}
        </div>
        <div id="deleteOrderMsg"></div>
      `;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    async function deleteMyOrder() {
      if (!currentDetailOrder) return;
      if (!confirm(`Xoá đơn hàng "${currentDetailOrder.customer_name}"? Không thể khôi phục lại.`)) return;
      try {
        await apiFetch(`/api/orders/${currentDetailOrder.id}`, { method: 'DELETE' });
        closeModal();
        loadOrders();
      } catch (err) {
        document.getElementById('deleteOrderMsg').innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    window.refreshList = loadOrders;
    loadOrders();
  </script>
</body>
</html>
